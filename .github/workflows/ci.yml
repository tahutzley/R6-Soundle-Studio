name: Phase 9 CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-unit-contract-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Studio
        uses: actions/checkout@v6
        with:
          path: R6-Soundle-Studio
      - name: Check out game contract authority
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/R6-Soundle
          ref: ${{ github.head_ref || github.ref_name }}
          path: R6-Soundle
          token: ${{ secrets.R6_SOUNDLE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            R6-Soundle-Studio/requirements.lock
            R6-Soundle/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r R6-Soundle-Studio/requirements.lock
          python -m pip install -r R6-Soundle/requirements.lock
      - name: Full Studio unit suite
        working-directory: R6-Soundle-Studio
        run: python -m unittest discover -s tests -v
      - name: Native startup and processor self-tests
        working-directory: R6-Soundle-Studio
        run: |
          python studio_server.py --self-test
          python processor/process_capture.py --self-test
          python processor/index_captures.py --root tests/fixtures/legacy-daily-sets --dry-run
      - name: Credential-free interrupted/resumed publisher simulation
        working-directory: R6-Soundle-Studio
        run: python -m unittest tests.test_publish_client -v
      - name: Locked dependency audit
        working-directory: R6-Soundle-Studio
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock
